# Public, non-operational template.  It contains no IP address, RTSP URL,
# detector weight, model path, or credential.  Copy it to a private location
# and replace endpoint placeholders and all site-specific calibration fields
# before any hardware use.
devices:
  - id: camera_01
    ip: REPLACE_WITH_PRIVATE_DEVICE_IP_01
    port: 37260
    position_m: [-5.0, -5.0, 1.5]
    mount_rpy_deg: [0.0, 25.0, 0.0]
    enabled: true
    yaw_limits_deg: [-130.0, 130.0]
    pitch_limits_deg: [-85.0, 25.0]
    zoom_limits: [1.0, 10.0]
    initial_yaw_deg: 0.0
    initial_pitch_deg: 0.0
    initial_zoom: 10.0
    max_slew_dps: 30.0
    calibration_verified: false
    rtsp_url: ""
    camera: &camera_template
      image_size: [1920, 1080]
      angular_std_deg: 0.15
      video_latency_s: 0.15
      time_uncertainty_s: 0.15
      intrinsics:
        # Placeholder values are not a physical calibration.
        - {zoom: 1.0, fx: 1613.72, fy: 1613.72, cx: 960.0, cy: 540.0, dist: [0, 0, 0, 0, 0]}
        - {zoom: 10.0, fx: 15696.52, fy: 15696.52, cx: 960.0, cy: 540.0, dist: [0, 0, 0, 0, 0]}
    control: &velocity_p_template
      mode: velocity_p
      yaw_sign: 1
      pitch_sign: 1
      yaw_offset_deg: 0.0
      pitch_offset_deg: 0.0
      yaw_velocity_sign: 1
      pitch_velocity_sign: -1
      normalize_pitch_feedback: true
      yaw_kp: 2.0
      pitch_kp: 2.0
      deadband_deg: 0.5
      yaw_speed_limit: 25
      pitch_speed_limit: 25
      command_timeout_s: 0.25
      use_ack: true
    capabilities: &capability_template
      zoom: true
      focus_direction: false
      autofocus: false
      gimbal_mode: false

  - id: camera_02
    ip: REPLACE_WITH_PRIVATE_DEVICE_IP_02
    port: 37260
    position_m: [-5.0, 5.0, 1.5]
    mount_rpy_deg: [0.0, 25.0, 0.0]
    enabled: true
    yaw_limits_deg: [-130.0, 130.0]
    pitch_limits_deg: [-85.0, 25.0]
    zoom_limits: [1.0, 10.0]
    initial_yaw_deg: 0.0
    initial_pitch_deg: 0.0
    initial_zoom: 10.0
    max_slew_dps: 30.0
    calibration_verified: false
    rtsp_url: ""
    camera: *camera_template
    control: *velocity_p_template
    capabilities: *capability_template

  - id: camera_03
    ip: REPLACE_WITH_PRIVATE_DEVICE_IP_03
    port: 37260
    position_m: [5.0, 5.0, 1.5]
    mount_rpy_deg: [0.0, 25.0, 0.0]
    enabled: true
    yaw_limits_deg: [-130.0, 130.0]
    pitch_limits_deg: [-85.0, 25.0]
    zoom_limits: [1.0, 10.0]
    initial_yaw_deg: 0.0
    initial_pitch_deg: 0.0
    initial_zoom: 10.0
    max_slew_dps: 30.0
    calibration_verified: false
    rtsp_url: ""
    camera: *camera_template
    control: *velocity_p_template
    capabilities: *capability_template

  - id: camera_04
    ip: REPLACE_WITH_PRIVATE_DEVICE_IP_04
    port: 37260
    position_m: [5.0, -5.0, 1.5]
    mount_rpy_deg: [0.0, 25.0, 0.0]
    enabled: true
    yaw_limits_deg: [-130.0, 130.0]
    pitch_limits_deg: [-85.0, 25.0]
    zoom_limits: [1.0, 10.0]
    initial_yaw_deg: 0.0
    initial_pitch_deg: 0.0
    initial_zoom: 10.0
    max_slew_dps: 30.0
    calibration_verified: false
    rtsp_url: ""
    camera: *camera_template
    control: *velocity_p_template
    capabilities: *capability_template

system:
  rate_hz: 10
  duration_s: 90
  telemetry_stale_s: 0.5
  max_frame_age_s: 0.6
  pose_max_gap_s: 0.2
  action_ttl_s: 0.5
  require_all_devices: true
  startup_timeout_s: 8

policy:
  name: custom
  custom: algorithms.user_policy:MyPolicy
  method: full_eacml
  requires_detection: false
  requires_video: true
  fixed_zoom: 10.0
  roi: {x: [100.0, 160.0], y: [-50.0, 50.0], z: [35.0, 85.0]}
  evaluation_grid:
    # Frozen evaluation cells, not a candidate-view lattice.  Candidate
    # viewpoints are constructed separately by the selected policy.
    shape: [8, 12, 4]
    cell_count: 384
    role: evaluation_cells
    construction: uniform_roi_cell_centers
    frozen_within_run: true
  # Deprecated compatibility alias for Kit-era loaders.  It must exactly equal
  # evaluation_grid.shape and must never be interpreted as candidate views.
  scan_grid: [8, 12, 4]
  scan_dwell_s: 0.8
  fov_margin: 0.08
  safe_envelope_deg:
    yaw: [-35.0, 35.0]
    pitch: [-20.0, 20.0]
  execution_confirmation:
    pose_tolerance_deg: 1.0
    max_rate_dps: 0.8
    settle_hold_s: 0.35
    min_dwell_s: 0.8
    distinct_frames: 3
    frame_timeout_s: 2.0
    frame_pose_max_gap_s: 0.2
    transition_timeout_s: 12.0
    require_ack: true
    require_frame: true
    measured_pose_projection: true
    allow_pose_only_fallback: false
  frame_quality:
    min_mean_luma: 8.0
    max_mean_luma: 247.0
    min_contrast: 4.0
    min_sharpness: 0.5
  calibration_evidence:
    # Keep false until supported by dated, per-device records.
    station_pose_verified: false
    per_device_intrinsics_verified: false
    fixed_zoom_verified: false
    video_latency_measured: false
    evidence_id: UNSET
  experiment:
    protocol_version: ral-hil-1
    horizon_s: 90.0
    plan_id: UNSET
    plan_run_id: UNSET
    block: -1
    method: full_eacml
    condition: nominal
    # instance/injection are shared within one paired block-condition group;
    # solver_seed is deliberately method-specific.
    instance_seed: 0
    injection_seed: 0
    solver_seed: 0
    optional_diagnostics:
      # These levels are descriptive options only.  They are not crossed with
      # the 120-run confirmatory plan; select at most three one-factor profiles.
      included_in_confirmatory_plan: false
      design: one_factor_at_a_time
      max_selected_profiles: 3
      device_counts: [2, 3, 4]
      roi_scale_factors: [0.75, 1.0, 1.25]
      overlap_targets: [0.10, 0.25, 0.40]
      task_grid_shapes: [[6, 10, 4], [8, 12, 4], [10, 15, 5]]
  fault_injection:
    # These fields alter policy bookkeeping only.  No network fault, SDK
    # command, or process suspension is performed by the planning tools.
    kind: none
    enabled: false
  commissioning:
    # generate_commissioning_plan.py writes a private executable overlay that
    # replaces these placeholders without copying device endpoints.
    plan_path: ""
    commissioning_id: ""
    transition_ids: []
  # Measured-CML-H and EA-CML-H must not silently use nominal timing in a
  # formal run. The commissioning method is intentionally unaffected.
  strict_measured_model: true
  initial_planner_budget_ms: 200.0
  repair_planner_budget_ms: 40.0
  robust_fov:
    # Freeze from development runs before generating the V2 formal plan.
    pose_error_yaw_deg: 1.0
    pose_error_pitch_deg: 1.0
    planning_pixel_margin: 0.0
    confirmation_pixel_margin: 0.0
    enforce_for_all_methods: true
  robust_objective:
    horizon_s: 60.0
    epsilon_s: 1.0e-6
    switch_min_gain_s: 0.05
    fault_recovery_bound_s: 8.0
    complete_mag_reference: true
  execution_model:
    status: uncalibrated
    model_path: ""
    sha256: ""
    target_definition: command_issued_to_frame_confirm
    includes_settle_dwell_and_frame_confirmation: true

fusion: {}
simulation:
  seed: 7
  detection_probability: 0.96
  pixel_noise_std: 0.7
  targets: []
  outages: []
detector: {type: none}
action_space: {enabled: [yaw_deg, pitch_deg]}
logging: {root: runs, queue_size: 30000}
control_center:
  enabled: true
  open_browser: true
  port: 0
  video_enabled: false
  preview_fps: 6
  heartbeat_timeout_s: 3
  default_mode: full_eacml
  duration_s: 0
  modes:
    - {id: raster, label: Raster, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: raster}}
    - {id: mag, label: Motion-aware greedy, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: mag}}
    - {id: open_loop_cml, label: Nominal-CML-H, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: open_loop_cml}}
    - {id: measured_static, label: Measured-CML-H, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: measured_static}}
    - {id: full_eacml, label: Full EA-CML-H, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: full_eacml}}
    - {id: uac_robust_repair_v2, label: Robust UAC Repair V2, policy: algorithms.user_policy:MyPolicy, requires_detection: false, requires_calibration: true, requires_video: true, settings: {method: uac_robust_repair_v2}}

